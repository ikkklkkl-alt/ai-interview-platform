[project]
name = "ai-interview-learning"
version = "0.1.0"
description = "从零学习并实现 AI 模拟面试平台"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
